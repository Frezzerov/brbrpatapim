<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #18251d 0%, #0d1110 45%, #070908 100%);

            color: #e8f5e9;
            font-family: Arial, sans-serif;
        }

        .game {
            width: min(92vw, 560px);
            padding: 25px;

            background: rgba(16, 22, 18, 0.92);
            border: 1px solid #26352b;
            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .snake-icon {
            font-size: 35px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #7f9185;
            font-size: 12px;
            margin-top: 4px;
        }

        .stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            min-width: 75px;
            padding: 9px 12px;

            text-align: center;

            background: #111813;
            border: 1px solid #26352b;
            border-radius: 12px;
        }

        .stat-name {
            display: block;
            font-size: 10px;
            color: #718178;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            display: block;
            margin-top: 3px;
            font-size: 19px;
            font-weight: bold;
            color: #8cff9a;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;

            padding: 8px;

            background: #080c09;
            border: 1px solid #26352b;
            border-radius: 17px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;

            border-radius: 11px;

            background:
                linear-gradient(rgba(120, 160, 130, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 160, 130, 0.035) 1px, transparent 1px);

            background-size: 20px 20px;
        }

        .message {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: rgba(5, 8, 6, 0.72);
            border-radius: 17px;

            backdrop-filter: blur(3px);
        }

        .message.hidden {
            display: none;
        }

        .message h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .message p {
            color: #8b9b91;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 18px;
        }

        .info {
            color: #718178;
            font-size: 12px;
            line-height: 1.7;
        }

        .info b {
            color: #a9bbb0;
        }

        button {
            border: none;
            border-radius: 12px;

            padding: 12px 18px;

            background: #8cff9a;
            color: #071008;

            font-weight: bold;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        button:hover {
            background: #a5ffaf;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .tip {
            margin-top: 14px;

            text-align: center;

            color: #506057;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .game {
                padding: 16px;
            }

            .header {
                align-items: flex-start;
                gap: 12px;
                flex-direction: column;
            }

            .stats {
                width: 100%;
            }

            .stat {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="header">

        <div class="title">
            <div class="snake-icon">🐍</div>

            <div>
                <h1>SNAKE</h1>
                <div class="subtitle">classic mini game</div>
            </div>
        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-name">Счёт</span>
                <span class="stat-value" id="score">0</span>
            </div>

            <div class="stat">
                <span class="stat-name">Рекорд</span>
                <span class="stat-value" id="highScore">0</span>
            </div>

        </div>

    </div>


    <div class="board-wrapper">

        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <div class="message hidden" id="message">

            <h2 id="messageTitle">Игра окончена</h2>

            <p id="messageText">
                Нажми кнопку ниже, чтобы начать заново
            </p>

        </div>

    </div>


    <div class="controls">

        <div class="info">
            <div><b>Стрелки</b> / <b>WASD</b> — движение</div>
            <div><b>Space</b> — пауза</div>
        </div>

        <button id="restartButton">
            Новая игра
        </button>

    </div>

    <div class="tip">
        Съешь яблоко 🍎 и не врежься в себя!
    </div>

</div>


<script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");

    const message = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    const restartButton = document.getElementById("restartButton");



    const tileSize = 15;

    const tileCount = canvas.width / tileSize;



    let snake;
    let food;

    let direction;
    let nextDirection;

    let score = 0;

    let highScore =
        Number(localStorage.getItem("snakeHighScore")) || 0;

    let gameOver = false;
    let paused = false;

    let gameSpeed = 110;

    let gameLoop;


    highScoreElement.textContent = highScore;


    function startGame() {

        snake = [
            { x: 12, y: 12 },
            { x: 11, y: 12 },
            { x: 10, y: 12 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        score = 0;

        gameOver = false;
        paused = false;

        gameSpeed = 110;

        scoreElement.textContent = score;

        hideMessage();

        createFood();

        clearInterval(gameLoop);

        gameLoop = setInterval(updateGame, gameSpeed);

        draw();
    }


    function createFood() {

        let validPosition = false;

        while (!validPosition) {

            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };

            validPosition = !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );
        }
    }


    function updateGame() {

        if (gameOver || paused) {
            return;
        }

        direction = nextDirection;

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };


        // Столкновение со стеной
        if (
            head.x < 0 ||
            head.x >= tileCount ||
            head.y < 0 ||
            head.y >= tileCount
        ) {

            endGame();
            return;
        }


        // Столкновение с собой
        if (
            snake.some(
                part =>
                    part.x === head.x &&
                    part.y === head.y
            )
        ) {

            endGame();
            return;
        }


        snake.unshift(head);


        // Съели еду
        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            scoreElement.textContent = score;


            if (score > highScore) {

                highScore = score;

                highScoreElement.textContent = highScore;

                localStorage.setItem(
                    "snakeHighScore",
                    highScore
                );
            }


            // Каждые 5 очков змейка ускоряется
            if (score % 5 === 0 && gameSpeed > 55) {

                gameSpeed -= 8;

                clearInterval(gameLoop);

                gameLoop = setInterval(
                    updateGame,
                    gameSpeed
                );
            }

            createFood();

        } else {

            snake.pop();
        }


        draw();
    }


    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );



        drawFood();



        snake.forEach(
            (part, index) => {

                const x = part.x * tileSize;
                const y = part.y * tileSize;


                ctx.fillStyle =
                    index === 0
                        ? "#b8ffbd"
                        : "#62d978";


                ctx.beginPath();

                ctx.roundRect(
                    x + 2,
                    y + 2,
                    tileSize - 4,
                    tileSize - 4,
                    5
                );

                ctx.fill();


                // Глаз
                if (index === 0) {

                    ctx.fillStyle = "#071008";

                    let eyeX = x + 13;
                    let eyeY = y + 6;

                    if (direction.x < 0) {
                        eyeX = x + 6;
                    }

                    if (direction.y > 0) {
                        eyeX = x + 6;
                        eyeY = y + 13;
                    }

                    if (direction.y < 0) {
                        eyeX = x + 13;
                        eyeY = y + 6;
                    }

                    ctx.beginPath();

                    ctx.arc(
                        eyeX,
                        eyeY,
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }
        );
    }


    function drawFood() {

        const centerX =
            food.x * tileSize + tileSize / 2;

        const centerY =
            food.y * tileSize + tileSize / 2;


        ctx.font = "17px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "🍎",
            centerX,
            centerY + 1
        );
    }



    function endGame() {

        gameOver = true;

        clearInterval(gameLoop);

        messageTitle.textContent = "Игра окончена";

        messageText.textContent =
            `Твой результат: ${score}`;

        message.classList.remove("hidden");
    }



    function showPause() {

        messageTitle.textContent = "Пауза";

        messageText.textContent =
            "Нажми Space, чтобы продолжить";

        message.classList.remove("hidden");
    }



    function hideMessage() {

        message.classList.add("hidden");
    }


    document.addEventListener(
        "keydown",
        event => {

            const key = event.key.toLowerCase();


            if (event.code === "Space") {

                event.preventDefault();

                if (!gameOver) {

                    paused = !paused;

                    if (paused) {
                        showPause();
                    } else {
                        hideMessage();
                    }
                }

                return;
            }


            let newDirection;


            if (
                key === "arrowup" ||
                key === "w"
            ) {

                newDirection = {
                    x: 0,
                    y: -1
                };

            } else if (
                key === "arrowdown" ||
                key === "s"
            ) {

                newDirection = {
                    x: 0,
                    y: 1
                };

            } else if (
                key === "arrowleft" ||
                key === "a"
            ) {

                newDirection = {
                    x: -1,
                    y: 0
                };

            } else if (
                key === "arrowright" ||
                key === "d"
            ) {

                newDirection = {
                    x: 1,
                    y: 0
                };

            } else {

                return;
            }


            event.preventDefault();


            // Запрещаем разворот на 180 градусов
            if (
                newDirection.x === -direction.x &&
                newDirection.y === -direction.y
            ) {
                return;
            }


            nextDirection = newDirection;
        }
    );


    restartButton.addEventListener(
        "click",
        startGame
    );


    // Запуск
    startGame();

</script>

</body>
</html>
